name: Tests & Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install pre-commit
      run: pip install pre-commit

    - name: Run pre-commit hooks (pull_request)
      if: github.event_name == 'pull_request'
      run: pre-commit run --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.sha }}

    - name: Run pre-commit hooks (push)
      if: github.event_name == 'push'
      run: pre-commit run --from-ref ${{ github.event.before }} --to-ref ${{ github.sha }}
